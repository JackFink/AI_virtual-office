<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 152 1280 464" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Sky & Cityscape Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a88f2"/>
      <stop offset="55%" stop-color="#6eb5ff"/>
      <stop offset="100%" stop-color="#bfe3ff"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a5d8ff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="wallRightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3d5dc"/>
      <stop offset="100%" stop-color="#c9b8c4"/>
    </linearGradient>
    <linearGradient id="portalGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9db" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fff9db" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c7d8c"/>
      <stop offset="50%" stop-color="#5a5b6b"/>
      <stop offset="100%" stop-color="#414250"/>
    </linearGradient>

    <!-- Reusable Plant Component -->
    <g id="officePlant">
      <rect x="-20" y="-56" width="40" height="56" rx="3" fill="#e9ecef" stroke="#2b2d38" stroke-width="2.5"/>
      <rect x="-20" y="-56" width="12" height="56" fill="#f8f9fa"/>
      <rect x="-23" y="-62" width="46" height="8" rx="2" fill="#dee2e6" stroke="#2b2d38" stroke-width="2.5"/>
      <path d="M0,-62 L0,-92" stroke="#5c3c24" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-16" cy="-76" rx="15" ry="9" transform="rotate(-25 -16 -76)" fill="#51cf66" stroke="#1e3a20" stroke-width="2.2"/>
      <ellipse cx="16" cy="-76" rx="15" ry="9" transform="rotate(25 16 -76)" fill="#40c057" stroke="#1e3a20" stroke-width="2.2"/>
      <ellipse cx="-12" cy="-94" rx="14" ry="8" transform="rotate(-18 -12 -94)" fill="#69db7c" stroke="#1e3a20" stroke-width="2.2"/>
      <ellipse cx="13" cy="-94" rx="14" ry="8" transform="rotate(18 13 -94)" fill="#51cf66" stroke="#1e3a20" stroke-width="2.2"/>
      <ellipse cx="0" cy="-105" rx="11" ry="15" fill="#8ce99a" stroke="#1e3a20" stroke-width="2.2"/>
    </g>

