      <rect x="12" y="60" width="11" height="32" fill="#ff922b"/>
      <rect x="23" y="60" width="11" height="32" fill="#51cf66"/>
      <rect x="34" y="60" width="11" height="32" fill="#339af0"/>
      <rect x="45" y="60" width="11" height="32" fill="#ffd43b"/>
