    <rect x="255" y="310" width="14" height="180" stroke="#74a9e8" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="430" y="340" width="16" height="160" stroke="#74a9e8" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="465" y="340" width="16" height="160" stroke="#74a9e8" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="635" y="325" width="16" height="170" stroke="#74a9e8" stroke-width="4" stroke-dasharray="8 6"/>
    <rect x="670" y="325" width="16" height="170" stroke="#74a9e8" stroke-width="4" stroke-dasharray="8 6"/>
  </g>

