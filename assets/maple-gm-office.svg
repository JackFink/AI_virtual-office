    <circle cx="290" cy="270" r="56"/>
    <circle cx="342" cy="286" r="42"/>
    <circle cx="540" cy="262" r="38"/>
    <circle cx="585" cy="248" r="52"/>
    <circle cx="635" cy="268" r="40"/>
    <circle cx="690" cy="252" r="62"/>
