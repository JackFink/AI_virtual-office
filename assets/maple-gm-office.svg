    <rect x="92" y="50" width="9" height="18" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="105" y="38" width="9" height="30" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="118" y="26" width="9" height="42" fill="#74c0fc" stroke="#475569" stroke-width="1.5"/>
