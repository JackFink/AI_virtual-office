<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>픽셀 스프라이트 좌표 전수 컨버터 & 방향 변환기</title>
  <style>
    :root {
      --bg: #090e17;
      --panel: #131c2a;
      --border: #223247;
      --text: #f1f5f9;
      --muted: #8497af;
      --accent: #38bdf8;
      --mint: #34d399;
      --amber: #fbbf24;
      --purple: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 10px 20px;
      background: #0f1724;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .paste-badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-btn-wrap {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-btn-wrap input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr 320px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111a27;
    }

    /* 좌측 데이터 트리 */
    .tree-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 11px;
      line-height: 1.6;
      background: #0d1420;
    }

    .coord-item {
      padding: 2px 5px;
      border-radius: 3px;
      cursor: pointer;
      display: inline-block;
      margin: 1px 0;
      color: #93c5fd;
      transition: 0.12s;
    }

    .coord-item:hover,
    .coord-item.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    /* 중앙 캔버스 뷰포트 */
    .viewport {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(#152233 15%, #0a1019 80%);
    }

    .drop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(56, 189, 248, 0.18);
      border: 2px dashed var(--accent);
      display: none;
      place-items: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      z-index: 20;
      pointer-events: none;
    }

    .toast-alert {
      position: absolute;
      top: 60px;
      background: #10b981;
      color: #042f1a;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 30;
      opacity: 0;
      transform: translateY(-8px);
      transition: 0.25s ease;
      pointer-events: none;
    }

    .toast-alert.show {
      opacity: 1;
      transform: translateY(0);
    }

    .top-toolbar {
      position: absolute;
      top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0c1420f0;
      padding: 6px 14px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }

    .direction-group {
      display: flex;
      gap: 4px;
    }

    .canvas-container {
      position: relative;
      border: 2px solid #2f435e;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      background: #0b111a;
      border-radius: 6px;
      overflow: hidden;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    .bottom-controls {
      position: absolute;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0c1420ee;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .btn {
      background: #1a2638;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover {
      background: #263850;
      border-color: #3b5273;
    }

    .btn.primary {
      background: var(--accent);
      color: #0a111a;
      border-color: var(--accent);
      font-weight: 700;
    }

    .btn.active {
      background: var(--mint);
      color: #081711;
      font-weight: 700;
      border-color: var(--mint);
    }

    .btn.dir-btn.active {
      background: var(--accent);
      color: #081711;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      padding-left: 6px;
      border-left: 1px solid var(--border);
    }

    .slider-wrap input[type=range] {
      width: 70px;
      cursor: pointer;
      accent-color: var(--accent);
    }

    /* 우측 인스펙터 패널 */
    .info-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background: #0c1420;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
    }

    .card-title {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pixel-data-box {
      font-family: monospace;
      font-size: 11.5px;
      background: #070c14;
      padding: 10px;
      border-radius: 6px;
      line-height: 1.8;
      border: 1px solid #1c2b3d;
    }

    .pixel-data-box strong {
      color: var(--mint);
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      max-height: 220px;
      overflow-y: auto;
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      background: #111a28;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
    }

    .swatch:hover,
    .swatch.active {
      border-color: var(--accent);
    }

    .swatch-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid #00000033;
      flex-shrink: 0;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 0;
    }

    .stats-row b {
      color: var(--text);
    }
  </style>
</head>

<body>

  <header>
    <div class="brand-title">
      픽셀 좌표 스프라이트 전수 컨버터 & 방향 변환기
      <span class="paste-badge">📋 Ctrl+V 붙여넣기 지원</span>
    </div>
    <div class="header-actions">
      <div class="file-btn-wrap">
        <button class="btn">📁 새 PNG 불러오기</button>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      <button class="btn primary" id="copyJsonBtn">현재 방향 좌표 복사 (JSON)</button>
    </div>
  </header>

  <div class="layout">
    <!-- 1. 좌측 변환 좌표 노드 트리 -->
    <div class="panel">
      <div class="panel-header">
        <span>현재 방향 좌표 (<span id="pixelCount">1586</span>개)</span>
        <span style="font-size:10px;color:var(--muted)">[X, Y, PaletteIndex]</span>
      </div>
      <div class="tree-scroll" id="jsonTree"></div>
    </div>

    <!-- 2. 중앙 렌더링 뷰포트 & 방향 툴바 -->
    <div class="panel viewport" id="dropArea">
      <div class="drop-overlay" id="dropOverlay">이미지를 여기에 놓으세요!</div>
      <div class="toast-alert" id="toastAlert">클립보드 이미지가 성공적으로 반영되었습니다!</div>

      <div class="top-toolbar">
        <span style="font-size:11px;font-weight:700;color:var(--muted)">시선 방향:</span>
        <div class="direction-group">
          <button class="btn dir-btn active" data-dir="left">⬅️ 좌측 (원본)</button>
          <button class="btn dir-btn" data-dir="right">➡️ 우측 (반전)</button>
          <button class="btn dir-btn" data-dir="front">👤 정면 (대칭 합성)</button>
        </div>
        <div class="slider-wrap" id="centerControl" style="display:none;">
          <span>중심축:</span>
          <input type="range" id="centerSlider" min="10" max="30" value="20" step="1">
          <span id="centerVal" style="color:var(--accent);font-weight:700;">20</span>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="spriteCanvas"></canvas>
      </div>

      <div class="bottom-controls">
        <button class="btn active" id="toggleGridBtn">격자 (Grid)</button>
        <button class="btn" id="zoomInBtn">확대 (+)</button>
        <button class="btn" id="zoomOutBtn">축소 (-)</button>
        <button class="btn" id="motionBtn">숨쉬기 모션</button>
      </div>
    </div>

    <!-- 3. 우측 상태 & 팔레트 인스펙터 -->
    <div class="panel">
      <div class="panel-header">스프라이트 인스펙터</div>
      <div class="info-panel">
        <div class="card">
          <div class="card-title">스프라이트 규격</div>
          <div class="stats-row"><span>시선 상태</span><b id="dirText" style="color:var(--accent)">좌측 (Left)</b></div>
          <div class="stats-row"><span>캔버스 해상도</span><b id="resText">44 × 68 px</b></div>
          <div class="stats-row"><span>현재 노드 수</span><b id="validPixelText">1,586 개</b></div>
          <div class="stats-row"><span>배율</span><b id="scaleText">6x</b></div>
        </div>

        <div class="card">
          <div class="card-title">선택된 픽셀 정보</div>
          <div class="pixel-data-box" id="pixelInspector">
            캔버스나 좌측 좌표를 클릭하면 상세 데이터가 표시됩니다.
          </div>
        </div>

        <div class="card">
          <div class="card-title">색상 팔레트 (<span id="paletteCount">24</span>종)</div>
          <div class="palette-grid" id="paletteGrid"></div>
        </div>
      </div>
    </div>
  </div>

    let palette = [

      "#2c0a00", "#fffcf7", "#f0853f", "#fff8f2"
    ];

    let currentPixels = [...rawPixels];
    let activeDirection = 'left';
    let frontCenterX = 20;
    let scale = 6;
    let showGrid = true;
    let selectedPixel = null;
    let isMotion = false;
    let motionTimer = null;
    let motionFrame = 0;

    const canvas = document.getElementById('spriteCanvas');
    const ctx = canvas.getContext('2d');

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function showToast(message) {
      const toast = document.getElementById('toastAlert');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // [핵심] 붙여넣기 또는 업로드된 이미지 파일 파싱
    function parseImageBlob(blob, sourceName = "클립보드") {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const offCanvas = document.createElement('canvas');
          const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
          const w = img.naturalWidth || img.width;
          const h = img.naturalHeight || img.height;
          offCanvas.width = w;
          offCanvas.height = h;
          offCtx.drawImage(img, 0, 0);

          const imgData = offCtx.getImageData(0, 0, w, h).data;
          const newPalette = [];
          const colorMap = new Map();
          const newPixels = [];

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = (y * w + x) * 4;
              const a = imgData[idx + 3];
              if (a < 25) continue; // 투명 픽셀 제거

              const hex = rgbToHex(imgData[idx], imgData[idx + 1], imgData[idx + 2]);
              if (!colorMap.has(hex)) {
                colorMap.set(hex, newPalette.length);
                newPalette.push(hex);
              }
              newPixels.push([x, y, colorMap.get(hex)]);
            }
          }

          if (newPixels.length === 0) {
            alert('유효한 픽셀이 없는 빈 이미지입니다.');
            return;
          }

          // 전역 데이터셋 갱신
          rawPixels = newPixels;
          palette = newPalette;
          frontCenterX = Math.round(w / 2);
          document.getElementById('centerSlider').max = w;
          document.getElementById('centerSlider').value = frontCenterX;
          document.getElementById('centerVal').textContent = frontCenterX;

          // 방향을 좌측(원본)으로 리셋 후 변환 적용
          activeDirection = 'left';
          document.querySelectorAll('.dir-btn').forEach(b => b.classList.toggle('active', b.dataset.dir === 'left'));
          document.getElementById('centerControl').style.display = 'none';

          buildPaletteUI();
          transformPixels();
          showToast(`✓ ${sourceName}에서 ${newPixels.length}개의 픽셀을 성공적으로 추출했습니다!`);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(blob);
    }

    // [신규] 클립보드 이미지 붙여넣기(Paste) 이벤트 리스너
    window.addEventListener('paste', (e) => {
      const clipboard = e.clipboardData || window.clipboardData;
      if (!clipboard || !clipboard.items) return;

      for (let i = 0; i < clipboard.items.length; i++) {
        const item = clipboard.items[i];
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          if (blob) {
            parseImageBlob(blob, "웹 클립보드");
            break;
          }
        }
      }
    });

    // 방향 변환 로직
    function transformPixels() {
      if (activeDirection === 'left') {
        currentPixels = [...rawPixels];
      } else if (activeDirection === 'right') {
        let minX = Infinity, maxX = -Infinity;
        rawPixels.forEach(([x]) => {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        });
        currentPixels = rawPixels.map(([x, y, c]) => [maxX + minX - x, y, c]);
      } else if (activeDirection === 'front') {
        const cx = frontCenterX;
        const pixelMap = new Map();

        rawPixels.forEach(([x, y, c]) => {
          if (x <= cx) {
            pixelMap.set(`${x},${y}`, [x, y, c]);
            const symX = cx + (cx - x);
            pixelMap.set(`${symX},${y}`, [symX, y, c]);
          }
        });

        // 우측 귀 및 디테일 영역 대칭 처리
        let maxX = 0; rawPixels.forEach(([x]) => { if (x > maxX) maxX = x; });
        rawPixels.forEach(([x, y, c]) => {
          if (x >= maxX - 8 && y >= 14 && y <= 28) {
            pixelMap.set(`${x},${y}`, [x, y, c]);
            const symLeftX = cx - (x - cx);
            if (symLeftX >= 0) pixelMap.set(`${symLeftX},${y}`, [symLeftX, y, c]);
          }
        });

        currentPixels = Array.from(pixelMap.values());
      }

      // X축 최소 여백 2px 정렬
      let minX = Infinity;
      currentPixels.forEach(([x]) => { if (x < minX) minX = x; });
      if (minX > 2) {
        const offset = minX - 2;
        currentPixels = currentPixels.map(([x, y, c]) => [x - offset, y, c]);
      }

      updateUI();
      render();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const yOffset = (isMotion && motionFrame === 1) ? 1 : 0;

      for (let i = 0; i < currentPixels.length; i++) {
        const [x, y, c] = currentPixels[i];
        const drawY = (y >= 36) ? y : (y + yOffset);
        ctx.fillStyle = palette[c] || '#ff00ff';
        ctx.fillRect(x * scale, drawY * scale, scale, scale);

        if (selectedPixel && selectedPixel.x === x && selectedPixel.y === y) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(x * scale, drawY * scale, scale, scale);
        }
      }

      if (showGrid && scale >= 4) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= canvas.width; x += scale) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += scale) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
      }
    }

    function resizeCanvas() {
      let maxX = 0, maxY = 0;
      currentPixels.forEach(([x, y]) => {
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      });
      const w = Math.max(maxX + 4, 44);
      const h = Math.max(maxY + 4, 68);
      canvas.width = w * scale;
      canvas.height = h * scale;
      document.getElementById('resText').textContent = `${w} × ${h} px`;
      render();
    }

    function updateUI() {
      document.getElementById('pixelCount').textContent = currentPixels.length;
      document.getElementById('validPixelText').textContent = `${currentPixels.length} 개`;
      document.getElementById('paletteCount').textContent = palette.length;
      document.getElementById('dirText').textContent =
        activeDirection === 'left' ? '좌측 (Left)' :
          activeDirection === 'right' ? '우측 (Right)' : `정면 (Front / Axis:${frontCenterX})`;

      const tree = document.getElementById('jsonTree');
      let html = `<div style="color:var(--muted)">// ${activeDirection.toUpperCase()} 모드 · 총 ${currentPixels.length}개 노드</div>`;
      currentPixels.forEach(([x, y, c]) => {
        html += `<span class="coord-item" data-x="${x}" data-y="${y}" data-c="${c}">[${x},${y},${c}]</span> `;
      });
      tree.innerHTML = html;

      tree.querySelectorAll('.coord-item').forEach(el => {
        el.addEventListener('click', () => {
          selectPixel(parseInt(el.dataset.x), parseInt(el.dataset.y), parseInt(el.dataset.c));
        });
      });

      resizeCanvas();
    }

    function buildPaletteUI() {
      const pGrid = document.getElementById('paletteGrid');
      pGrid.innerHTML = '';
      palette.forEach((hex, i) => {
        const item = document.createElement('div');
        item.className = 'swatch';
        item.innerHTML = `<span class="swatch-color" style="background:${hex}"></span><span>[${i}] ${hex}</span>`;
        pGrid.appendChild(item);
      });
    }

    function selectPixel(x, y, c) {
      selectedPixel = { x, y, c };
      const hex = palette[c];
      document.getElementById('pixelInspector').innerHTML = `
        • 좌표: <strong>X: ${x}, Y: ${y}</strong><br>
        • 팔레트 인덱스: <strong>[${c}]</strong><br>
        • 컬러 코드: <span style="display:inline-block;width:10px;height:10px;background:${hex};vertical-align:middle;margin-right:4px;border-radius:2px;"></span><strong>${hex}</strong><br>
        • 데이터 노드: <code>[${x}, ${y}, ${c}]</code>
      `;
      render();
    }

    // 파일 업로드 & 드래그 앤 드롭
    const imageInput = document.getElementById('imageInput');
    const dropArea = document.getElementById('dropArea');
    const dropOverlay = document.getElementById('dropOverlay');

    imageInput.addEventListener('change', (e) => {
      if (e.target.files?.[0]) parseImageBlob(e.target.files[0], "로컬 파일");
    });
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.style.display = 'grid'; });
    dropArea.addEventListener('dragleave', () => { dropOverlay.style.display = 'none'; });
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.style.display = 'none';
      if (e.dataTransfer.files?.[0]) parseImageBlob(e.dataTransfer.files[0], "드롭된 파일");
    });

    // 방향 전환 버튼
    document.querySelectorAll('.dir-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeDirection = btn.dataset.dir;
        document.getElementById('centerControl').style.display = (activeDirection === 'front') ? 'flex' : 'none';
        transformPixels();
      });
    });

    document.getElementById('centerSlider').addEventListener('input', (e) => {
      frontCenterX = parseInt(e.target.value);
      document.getElementById('centerVal').textContent = frontCenterX;
      if (activeDirection === 'front') transformPixels();
    });

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / scale);
      const y = Math.floor((e.clientY - rect.top) / scale);
      const found = currentPixels.find(p => p[0] === x && p[1] === y);
      if (found) selectPixel(found[0], found[1], found[2]);
    });

    document.getElementById('toggleGridBtn').addEventListener('click', (e) => {
      showGrid = !showGrid;
      e.target.classList.toggle('active', showGrid);
      render();
    });
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      if (scale < 16) { scale += 1; document.getElementById('scaleText').textContent = `${scale}x`; resizeCanvas(); }
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      if (scale > 2) { scale -= 1; document.getElementById('scaleText').textContent = `${scale}x`; resizeCanvas(); }
    });
    document.getElementById('motionBtn').addEventListener('click', (e) => {
      isMotion = !isMotion;
      e.target.classList.toggle('active', isMotion);
      if (isMotion) {
        motionTimer = setInterval(() => { motionFrame = (motionFrame === 0 ? 1 : 0); render(); }, 350);
      } else {
        clearInterval(motionTimer);
        motionFrame = 0;
        render();
      }
    });

    document.getElementById('copyJsonBtn').addEventListener('click', () => {
      const exportData = {
        meta: {
          direction: activeDirection,
          totalPixels: currentPixels.length,
          frontCenterX: activeDirection === 'front' ? frontCenterX : null
        },
        pixels: currentPixels
      };
      navigator.clipboard.writeText(JSON.stringify(exportData, null, 2));
      showToast(`✓ [${activeDirection.toUpperCase()}] 좌표 ${currentPixels.length}개가 복사되었습니다!`);
    });

    // 최초 렌더링
    buildPaletteUI();
    transformPixels();
  </script>
</body>

</html>
